<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi there! 👋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Stark, dass du gescannt hast! 🚀</h1>
        <p>Neugier zahlt sich bekanntlich aus. Schön, dass du hier gelandet bist.</p>
        <!-- Hier kannst du deinen Instagram-Account oder Kontakt-Link eintragen -->
        <a href="https://instagram.com/dein-username" class="btn" target="_blank">Sag Hi auf Instagram</a>
    </div>
</body>
</html>
